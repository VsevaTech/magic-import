# Regenerates the binary assets that are produced by code, and commits them:
#   * app/static/app.css              (Tailwind v4 build of app/static/src/input.css)
#   * app/static/vendor/alpine.min.js (pinned Alpine.js build from npm)
#   * demo-data/*.xlsx                (deterministic generator)
#   * docs/screenshots/*.png          (real screenshots taken by the Playwright demo)
# Runs on demand and whenever the generator / UI changes.
name: Assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo-data/generate_demo_data.py"
      - "scripts/browser_demo.py"
      - "scripts/build_frontend.sh"
      - "app/templates/**"
      - "app/static/**"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip assets]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python demo-data/generate_demo_data.py
      - name: Build front-end assets (Tailwind CSS + vendored Alpine.js)
        run: sh scripts/build_frontend.sh
      - name: Start app
        run: |
          mkdir -p data
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
      - name: Run browser demo (takes the README screenshots)
        run: |
          set -o pipefail
          python scripts/browser_demo.py --out docs/screenshots 2>&1 | tee e2e.log
      - name: Publish failure log as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { printf '### %s: browser demo failed\n\n```\n' "${{ github.workflow }}"; tail -c 60000 e2e.log; printf '\n```\n'; } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md || echo "could not post the comment"
      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/app.css app/static/vendor/alpine.min.js demo-data/*.xlsx demo-data/*.csv docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "assets unchanged"
          else
            git commit -m "chore(assets): regenerate front-end build, demo data and screenshots [skip ci]"
            git push
          fi
